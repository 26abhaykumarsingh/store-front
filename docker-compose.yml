version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-storefront3}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  web:
    build: .
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=storefront.settings.prod
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - MYSQL_HOST=${MYSQL_HOST:-db}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-storefront3}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/2}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT:-2525}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-from@abhay.com}
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    restart: always
    command: celery -A storefront worker --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=storefront.settings.prod
      - SECRET_KEY=${SECRET_KEY}
      - MYSQL_HOST=${MYSQL_HOST:-db}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-storefront3}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/2}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT:-2525}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-from@abhay.com}
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    restart: always
    command: celery -A storefront beat --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=storefront.settings.prod
      - SECRET_KEY=${SECRET_KEY}
      - MYSQL_HOST=${MYSQL_HOST:-db}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-storefront3}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/2}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT:-2525}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-from@abhay.com}
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.21-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_etc:
  certbot_www:
